name = "blazenote-backend"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = [ "nodejs_compat" ]

# Custom domain configuration
[[routes]]
pattern = "blazenote-backend.emithruhike.com"
custom_domain = true


[[d1_databases]]
binding = "DB"
database_name = "blazenote"
database_id = "fd9c211c-2e40-486e-ae37-55aaecea3707"
migrations_dir = "./migrations"

# [ai]
# binding = "AI"

# [[r2_buckets]]
# binding = "R2_BUCKET"
# bucket_name = "blazenote"
# preview_bucket_name = "dev-blazenote"

[observability.logs]
enabled = true
